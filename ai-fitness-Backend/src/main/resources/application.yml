server:
  port: ${PORT:7860}

spring:
  application:
    name: ai-fitness-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_fitness_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET:4b1f63e9f45d8b8a7b9e8b4562c1d4e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:qwen/qwen3.8-27b}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}

cv:
  base-url: ${CV_BASE_URL:http://localhost:5000}

agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8000}

app:
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:8080/reset-password}
