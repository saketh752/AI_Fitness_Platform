# ==============================================================
# Render Blueprint (Infrastructure as Code) - AI Fitness Platform
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================

services:
  # ------------------------------------------------------------
  # 1. Spring Boot Monolith Backend (Free Plan)
  # ------------------------------------------------------------
  - type: web
    name: ai-fitness-backend
    env: docker
    dockerfilePath: ./ai-fitness-Backend/Dockerfile
    dockerContext: ./ai-fitness-Backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:mysql://ai-fitness-platform-sakethyadav208-05d6.b.aivencloud.com:14065/ai_fitness_platform?useSSL=true&requireSSL=false
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: JWT_SECRET
        value: a26480a90f9f49fea6e0843e021fef26f9ed7dba74a96f06231c2ba76ff1b720
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CV_BASE_URL
        value: https://cv-exercise-analysis.onrender.com

  # ------------------------------------------------------------
  # 2. Python CV Exercise Analysis Microservice (Free Plan)
  # ------------------------------------------------------------
  - type: web
    name: cv-exercise-analysis
    env: docker
    dockerfilePath: ./cv-exercise-analysis/Dockerfile
    dockerContext: ./cv-exercise-analysis
    plan: free
    healthCheckPath: /health

  # ------------------------------------------------------------
  # 3. Flutter Web Frontend (Free Static Site)
  # ------------------------------------------------------------
  - type: web
    name: ai-fitness-frontend
    runtime: static
    plan: free
    rootDir: ai_fitness_app
    buildCommand: git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter && ./_flutter/bin/flutter build web --release --dart-define=API_BASE_URL=https://ai-fitness-backend-0klk.onrender.com
    staticPublishPath: ./build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

