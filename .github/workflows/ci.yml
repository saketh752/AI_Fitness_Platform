name: CI Pipeline - AI Fitness Platform

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ------------------------------------------------------------
  # Job 1: Test Flutter App
  # ------------------------------------------------------------
  flutter-tests:
    name: Flutter Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./ai_fitness_app
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: ./ai_fitness_app
        run: flutter test

  # ------------------------------------------------------------
  # Job 2: Test Spring Boot Backend
  # ------------------------------------------------------------
  backend-tests:
    name: Spring Boot Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./ai-fitness-Backend
        run: ./mvnw clean test -B

  # ------------------------------------------------------------
  # Job 3: Test Python AI Agent
  # ------------------------------------------------------------
  ai-agent-tests:
    name: AI Agent Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./ai-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest
        working-directory: ./ai-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test_key' }}
        run: pytest tests/

  # ------------------------------------------------------------
  # Job 4: Test Python CV Exercise Service
  # ------------------------------------------------------------
  cv-tests:
    name: CV Analysis Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./cv-exercise-analysis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest
        working-directory: ./cv-exercise-analysis
        run: pytest tests/ -k "not manual"

